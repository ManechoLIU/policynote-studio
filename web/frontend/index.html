<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before styles load to avoid a bright flash on reload.
      (function () {
        var theme;
        try { theme = localStorage.getItem('easel_theme'); } catch (_) { /* Storage may be unavailable. */ }
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script>
      // 子路径代理下必须带结尾斜杠，否则相对资源路径(./assets)会解析到上一级 → 404 白屏。
      // 若当前路径无结尾斜杠且末段不像文件名(无扩展名)，自动补斜杠后重载。
      (function () {
        var p = location.pathname;
        var last = p.split('/').pop();
        if (p && !p.endsWith('/') && !/\.[a-z0-9]+$/i.test(last)) {
          location.replace(p + '/' + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./static/mingya-workspace-mark.svg" />
    <!-- 使用系统字体，避免外部字体请求影响工作台加载。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>明亚小红书工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
